<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fruitas v2 (pujar imatge)</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    .card { border: 1px solid #eee; border-radius: 10px; padding: 14px; margin: 12px 0; }
    img { max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 10px; }
    .small { color: #555; font-size: 14px; margin-top: 6px; }
    .row { margin: 10px 0; }
    .bar { height: 10px; background: #eee; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .bar > div { height: 100%; background: #111; width: 0%; }
    .top { font-size: 18px; margin-top: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Classificador de Fruita (v2)</h1>
    <div class="card">
      <b>Puja una imatge (JPG/PNG):</b><br>
      <input id="fileInput" type="file" accept="image/*" />
      <div class="small">Prova una foto diferent de les d’entrenament.</div>
    </div>

    <div class="card">
      <b>Previsualització</b>
      <div class="row">
        <img id="preview" alt="Previsualització" />
      </div>
    </div>

    <div class="card" id="results">
      <b>Resultats</b>
      <div class="small">Encara no has pujat cap imatge.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <script>
    // ⚠️ Posa aquí el teu Model URL (ha d’acabar amb "/")
    const URL = "https://teachablemachine.withgoogle.com/models/wyPf-1zk0/"; // <- el teu

    let model = null;

    async function loadModelOnce() {
      if (!URL || !URL.startsWith("http")) {
        throw new Error("Model URL incorrecte.");
      }
      if (model) return;

      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";
      model = await tmImage.load(modelURL, metadataURL);
    }

    function renderResults(predictions) {
      const results = document.getElementById("results");
      results.innerHTML = "<b>Resultats</b>";

      // Ordena de més probable a menys probable
      predictions.sort((a, b) => b.probability - a.probability);

      const top = predictions[0];
      const topPct = Math.round(top.probability * 100);
      const topDiv = document.createElement("div");
      topDiv.className = "top";
      topDiv.innerHTML = `Predicció principal: <b>${top.className}</b> (${topPct}%)`;
      results.appendChild(topDiv);

      for (const p of predictions) {
        const pct = Math.round(p.probability * 100);
        const line = document.createElement("div");
        line.style.marginTop = "12px";
        line.innerHTML = `
          <div><b>${p.className}</b> — ${pct}%</div>
          <div class="bar"><div style="width:${pct}%"></div></div>
        `;
        results.appendChild(line);
      }
    }

    async function predictFromImage(imgEl) {
      await loadModelOnce();
      const predictions = await model.predict(imgEl, false);
      renderResults(predictions);
    }

    const input = document.getElementById("fileInput");
    const preview = document.getElementById("preview");

    input.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const objectURL = URL.createObjectURL(file);
      preview.src = objectURL;

      preview.onload = async () => {
        try {
          document.getElementById("results").innerHTML =
            "<b>Resultats</b><div class='small'>Analitzant...</div>";
          await predictFromImage(preview);
        } catch (err) {
          console.error(err);
          document.getElementById("results").innerHTML =
            "<b>Resultats</b><div class='small'>Error: no s’ha pogut carregar el model o processar la imatge.</div>";
        } finally {
          URL.revokeObjectURL(objectURL);
        }
      };
    });
  </script>
</body>
</html>
